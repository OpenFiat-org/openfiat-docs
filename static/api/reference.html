<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenFiat Node API Reference</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; display: flex; height: 100vh; }
  aside { width: 280px; overflow-y: auto; border-right: 1px solid #8884; padding: 1rem; box-sizing: border-box; }
  main { flex: 1; overflow-y: auto; padding: 1.5rem 2rem; box-sizing: border-box; }
  h1 { font-size: 1.1rem; margin-top: 0; }
  ul { list-style: none; margin: 0; padding: 0; }
  li button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 0.35rem 0.5rem; cursor: pointer; border-radius: 4px; font-family: monospace; font-size: 0.85rem; color: inherit; }
  li button:hover, li button.active { background: #8882; }
  pre { background: #8881; padding: 0.75rem; border-radius: 6px; overflow-x: auto; }
  textarea { width: 100%; min-height: 6rem; font-family: monospace; box-sizing: border-box; }
  input.node-url { width: 100%; box-sizing: border-box; font-family: monospace; padding: 0.3rem; margin-bottom: 0.5rem; }
  button.run { margin-top: 0.5rem; padding: 0.4rem 1rem; cursor: pointer; }
  section { margin-bottom: 1.5rem; }
  .method-name { font-family: monospace; font-size: 1.3rem; }
  .badge { display: inline-block; font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 3px; margin-left: 0.5rem; vertical-align: middle; }
  .badge.get { background: #2a72; }
  .badge.send { background: #c722; }
  .hint { font-size: 0.8rem; opacity: 0.75; }
</style>
</head>
<body>
<aside>
  <h1>OpenFiat Node API</h1>
  <input id="filter" placeholder="Filter methods..." style="width: 100%; box-sizing: border-box; margin-bottom: 0.5rem;" />
  <ul id="method-list"></ul>
</aside>
<main id="content">
  <p>Loading <code>openrpc.json</code>…</p>
</main>
<script>
async function main() {
  // This page is served statically from openfiat-docs, not from a
  // running node — unlike openfiat-core's crates/api (which serves the
  // same page at /docs, same-origin with a live /rpc), "Try it" here
  // needs to know which node to actually call.
  const doc = await fetch('./openrpc.json').then(r => r.json());
  const list = document.getElementById('method-list');
  const content = document.getElementById('content');
  const filterInput = document.getElementById('filter');

  function badge(name) {
    return name.startsWith('send') ? '<span class="badge send">send</span>' : '<span class="badge get">get</span>';
  }

  function renderList(filter) {
    list.innerHTML = '';
    doc.methods
      .filter(m => m.name.toLowerCase().includes(filter.toLowerCase()))
      .forEach(m => {
        const li = document.createElement('li');
        const btn = document.createElement('button');
        btn.textContent = m.name;
        btn.onclick = () => { renderMethod(m); document.querySelectorAll('#method-list button').forEach(b => b.classList.remove('active')); btn.classList.add('active'); };
        li.appendChild(btn);
        list.appendChild(li);
      });
  }

  function renderMethod(m) {
    const paramsSchema = m.params[0].schema;
    const exampleParams = {};
    for (const key of Object.keys(paramsSchema.properties || {})) exampleParams[key] = '';
    const savedNodeUrl = localStorage.getItem('openfiat-node-url') || 'http://localhost:7080';

    content.innerHTML = `
      <div class="method-name">${m.name}${badge(m.name)}</div>
      <p>${m.summary}</p>
      <section>
        <h3>Params schema</h3>
        <pre>${JSON.stringify(paramsSchema, null, 2)}</pre>
      </section>
      <section>
        <h3>Result schema</h3>
        <pre>${JSON.stringify(m.result.schema, null, 2)}</pre>
      </section>
      <section>
        <h3>Try it</h3>
        <p class="hint">Against a node you're running yourself — this docs site has no live node of its own.</p>
        <input class="node-url" id="node-url" value="${savedNodeUrl}" placeholder="http://localhost:7080" />
        <textarea id="try-params">${JSON.stringify(exampleParams, null, 2)}</textarea>
        <div><button class="run" id="run-button">POST /rpc</button></div>
        <pre id="try-result"></pre>
      </section>
    `;

    document.getElementById('run-button').onclick = async () => {
      const resultEl = document.getElementById('try-result');
      const nodeUrl = document.getElementById('node-url').value.replace(/\/$/, '');
      localStorage.setItem('openfiat-node-url', nodeUrl);
      let params;
      try {
        params = JSON.parse(document.getElementById('try-params').value);
      } catch (e) {
        resultEl.textContent = 'Invalid JSON in params: ' + e.message;
        return;
      }
      const body = { jsonrpc: '2.0', id: 1, method: m.name, params };
      resultEl.textContent = 'Running…';
      try {
        const response = await fetch(nodeUrl + '/rpc', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
        resultEl.textContent = JSON.stringify(await response.json(), null, 2);
      } catch (e) {
        resultEl.textContent = 'Request failed: ' + e.message + ' (check the node URL above, and that the node allows cross-origin requests from this page)';
      }
    };
  }

  filterInput.addEventListener('input', () => renderList(filterInput.value));
  renderList('');
  content.innerHTML = `<p>${doc.info.description}</p><p>Select a method on the left to see its shape, or point "Try it" at a node you're running to call it live.</p>`;
}
main().catch(e => { document.getElementById('content').textContent = 'Failed to load API reference: ' + e.message; });
</script>
</body>
</html>
